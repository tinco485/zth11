<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a56b0">
<title>施工日志</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--blue:#1a56b0;--blue2:#e8f0fc;--line:#d9e2ef;--txt:#22303f;--mut:#7a8aa0;--red:#d43a3a;--bg:#f2f5f9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt);background:var(--bg)}
header{position:sticky;top:0;z-index:50;background:var(--blue);color:#fff;padding:8px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 2px 6px rgba(0,0,0,.15)}
header .ttl{font-weight:700;font-size:17px;flex:1;min-width:90px}
header button{border:0;border-radius:8px;padding:8px 12px;font-size:14px;background:rgba(255,255,255,.18);color:#fff}
header button.pri{background:#ffb400;color:#4a3200;font-weight:700}
#menu{position:absolute;right:8px;top:52px;background:#fff;color:var(--txt);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;flex-direction:column;min-width:170px;overflow:hidden}
#menu button{background:#fff;color:var(--txt);text-align:left;padding:11px 14px;border-radius:0;border-bottom:1px solid var(--line)}
main{max-width:760px;margin:0 auto;padding:10px 10px 90px}
details{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:visible}
summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:15px;color:var(--blue);list-style:none;display:flex;align-items:center}
summary::before{content:"▸";margin-right:8px;transition:.15s}
details[open]>summary::before{transform:rotate(90deg)}
.sec{padding:4px 12px 14px}
h4{margin:14px 0 6px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h4 .add{margin-left:auto}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--txt)}
button.add{background:var(--blue2);color:var(--blue);border-color:var(--blue)}
button.del{color:var(--red);border-color:#f0caca;padding:4px 8px}
button.mini{padding:3px 8px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid.c3{grid-template-columns:1fr 1fr 1fr}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>label{font-size:12px;color:var(--mut)}
.fld.full{grid-column:1/-1}
input,select,textarea{font:14px/1.5 inherit;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue2);border-color:var(--blue)}
input[readonly]{background:#f4f6f9;color:var(--mut)}
textarea{resize:vertical;min-height:56px}
.row{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fbfcfe;position:relative}
.row .rhead{display:flex;align-items:center;margin-bottom:6px;font-size:12px;color:var(--mut)}
.row .rhead .del{margin-left:auto}
.combo{position:relative}
.combo input{padding-right:26px}
.combo::after{content:"▾";position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none;font-size:12px}
.pop{position:absolute;left:0;right:0;top:calc(100% + 2px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:260px;overflow:auto;z-index:60}
.pop .grp{font-size:11px;color:var(--mut);padding:5px 10px 2px;background:#f7f9fc;position:sticky;top:0}
.pop .it{padding:8px 10px;font-size:14px;border-bottom:1px solid #f0f3f8;display:flex;gap:6px;align-items:center}
.pop .it:active,.pop .it:hover{background:var(--blue2)}
.pop .it .tag{font-size:10px;background:#ffe9c2;color:#8a5b00;border-radius:4px;padding:0 4px;flex:none}
.pop .it .sub{font-size:11px;color:var(--mut);margin-left:auto;flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .addnew{color:var(--blue);font-weight:600}
.pop .empty{padding:10px;color:var(--mut);font-size:13px}
.hintbox{background:#fff8e6;border:1px solid #f0dfa8;border-radius:10px;padding:8px 12px;font-size:13px;color:#7a5b00;margin-bottom:10px}
.hintbox:empty{display:none}
.badge{display:inline-block;background:var(--red);color:#fff;font-size:11px;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px}
.chk input{width:auto}
.rangewrap{display:flex;align-items:center;gap:8px}
.rangewrap input[type=range]{flex:1;padding:0}
.rangewrap output{font-size:13px;color:var(--blue);min-width:42px;text-align:right}
#histList .hitem{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:9px 2px;font-size:13px;flex-wrap:wrap}
#histList .hitem b{color:var(--blue)}
#histList .hitem .ops{margin-left:auto;display:flex;gap:6px}
#dictList{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px}
#dictList .ditem{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid #f0f3f8;font-size:13px}
#dictList .ditem.off{opacity:.45}
#dictList .ditem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modal{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
#modal .box{background:#fff;border-radius:14px;width:100%;max-width:680px;max-height:92vh;display:flex;flex-direction:column;padding:14px;gap:10px}
#modal textarea{flex:1;min-height:46vh;font-size:13px;line-height:1.7;white-space:pre}
#modal .mops{display:flex;gap:8px;flex-wrap:wrap}
#modal .mops button{flex:1;padding:10px}
#modal .mops .pri{background:var(--blue);color:#fff;border-color:var(--blue)}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#22303f;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:.95}
#toast.err{background:var(--red)}
.errmsg{color:var(--red);font-size:13px;margin:4px 0}
.projname{font-size:12px;color:var(--mut);padding:0 2px 6px}
#printArea{display:none}
@media print{
 body>*{display:none!important}
 #printArea{display:block!important;font:12pt/1.9 "SimSun",serif;color:#000}
 #printArea h1{text-align:center;font-size:16pt}
 #printArea pre{white-space:pre-wrap;font:inherit}
 #printArea .sign{display:flex;justify-content:space-between;margin-top:40px}
 @page{size:A4;margin:20mm 18mm}
}
@media (max-width:480px){.grid.c3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div class="ttl">施工日志</div>
  <button class="pri" id="btnGen">生成并复制</button>
  <button id="btnSave">保存</button>
  <button id="btnMenu">⋯</button>
  <div id="menu" hidden>
    <button id="mNew">新建日志</button>
    <button id="mYest">复制昨日</button>
    <button id="mHist">历史记录</button>
    <button id="mSet">设置与字典库</button>
    <button id="mExp">导出 JSON 备份</button>
    <button id="mImp">导入 JSON 备份</button>
  </div>
</header>
<main>
<div class="projname" id="projName"></div>
<div class="hintbox" id="hintBox"></div>

<details open>
<summary>① 日志信息</summary>
<div class="sec">
  <div class="grid">
    <div class="fld"><label>编号（保存时自动生成）</label><input id="fNo" readonly placeholder="保存后生成"></div>
    <div class="fld"><label>日期 *</label><input type="date" id="fDate"></div>
    <div class="fld"><label>星期</label><input id="fWeek" readonly></div>
    <div class="fld"><label>记录人 *</label><div id="cRecorder"></div></div>
    <div class="fld full" id="backWrap" hidden><label>补记原因 *（日期非当天）</label><input id="fBack" placeholder="如：昨日夜间加班未及时记录"></div>
    <div class="fld"><label>天气现象</label><div id="cW1"></div></div>
    <div class="fld"><label class="chk" style="margin-top:20px"><input type="checkbox" id="fZhuan">转</label><div id="cW2" hidden></div></div>
    <div class="fld"><label>风力等级</label><select id="fWind"><option value="">未填</option><option>0~3级</option><option>4级</option><option>5级</option><option>6级</option><option>7级</option><option>8级及以上</option></select></div>
    <div class="fld"><label>气温（最低℃）</label><input type="number" id="fTmin" inputmode="decimal" placeholder="如 25"></div>
    <div class="fld"><label>气温（最高℃）</label><input type="number" id="fTmax" inputmode="decimal" placeholder="如 32"></div>
  </div>
  <div class="errmsg" id="headErr"></div>
</div>
</details>

<details open>
<summary>② 施工进度与作业内容</summary>
<div class="sec">
  <h4>截至今日进度<button class="add" data-add="progress">＋ 添加</button></h4>
  <div id="rows-progress"></div>
  <h4>今日作业内容 *<button class="add" data-add="today">＋ 添加</button></h4>
  <div id="rows-today"></div>
  <h4>明日计划<button class="add" data-add="plan">＋ 添加</button></h4>
  <div id="rows-plan"></div>
  <h4>未完成事项<button class="add" data-add="undone">＋ 添加</button></h4>
  <label class="chk"><input type="checkbox" id="undoneNone">无未完成事项</label>
  <div id="rows-undone"></div>
</div>
</details>

<details>
<summary>③ 资源投入</summary>
<div class="sec">
  <h4>人员（按工种）<button class="mini" id="btnCrew">常用班组配置</button><button class="add" data-add="labor">＋ 添加</button></h4>
  <div id="rows-labor"></div>
  <div id="laborSum" style="font-size:13px;color:var(--blue)"></div>
  <h4>机械<button class="add" data-add="machine">＋ 添加</button></h4>
  <div id="rows-machine"></div>
  <h4>材料<button class="add" data-add="material">＋ 添加</button></h4>
  <div id="rows-material"></div>
</div>
</details>

<details>
<summary>④ 质量管理</summary>
<div class="sec">
  <h4>验收记录<button class="add" data-add="accept">＋ 添加</button></h4>
  <div id="rows-accept"></div>
  <h4>质量问题（点问题自动带出处理方法）<button class="add" data-add="quality">＋ 添加</button></h4>
  <div id="rows-quality"></div>
</div>
</details>

<details>
<summary>⑤ 特殊情况</summary>
<div class="sec">
  <h4>停工 / 复工</h4>
  <label class="chk"><input type="checkbox" id="stopNone" checked>无停工/复工</label>
  <div id="stopForm" hidden>
    <div class="grid">
      <div class="fld full"><label>原因</label><input id="stopReason"></div>
      <div class="fld"><label>开始时间</label><input id="stopStart" placeholder="如 2026-11-14 08:00"></div>
      <div class="fld"><label>结束/复工时间</label><input id="stopEnd"></div>
      <div class="fld full"><label>现场保护措施</label><textarea id="stopProtect"></textarea></div>
    </div>
  </div>
  <h4>突发事件<button class="add" data-add="emergency">＋ 添加</button></h4>
  <div id="rows-emergency"></div>
  <h4>其他事项（参观/检查/文书等）<button class="mini" id="btnPhrase">常用短语库</button><button class="add" data-add="other">＋ 添加</button></h4>
  <div id="rows-other"></div>
</div>
</details>

<details id="secHistory">
<summary>⑥ 历史记录</summary>
<div class="sec"><div id="histList"></div></div>
</details>

<details id="secSettings">
<summary>⑦ 设置与字典库</summary>
<div class="sec">
  <div class="grid">
    <div class="fld full"><label>项目名称</label><input id="sProj"></div>
    <div class="fld"><label>编号前缀</label><input id="sPrefix"></div>
    <div class="fld"><label>默认记录人</label><div id="cDefRec"></div></div>
  </div>
  <h4>常用班组配置</h4>
  <div id="crewList"></div>
  <button class="add mini" id="btnCrewAdd">＋ 新增班组</button>
  <h4>字典库维护（停用项历史保留、新建不可选）</h4>
  <div class="grid">
    <div class="fld"><label>选择字典</label><select id="dictSel"></select></div>
    <div class="fld"><label>新增条目</label><div style="display:flex;gap:6px"><input id="dictNew" placeholder="名称"><button class="add" id="btnDictAdd" style="flex:none">添加</button></div></div>
  </div>
  <div id="dictList"></div>
</div>
</details>
</main>

<div id="modal" hidden>
  <div class="box">
    <b id="modalTitle">日志文本</b>
    <textarea id="modalText" readonly></textarea>
    <div class="mops">
      <button class="pri" id="mCopy">复制</button>
      <button id="mTxt">导出TXT</button>
      <button id="mPrint">打印(A4)</button>
      <button id="mClose">关闭</button>
    </div>
  </div>
</div>
<div id="printArea"></div>
<div id="toast"></div>
<input type="file" id="fileImp" accept=".json,application/json" hidden>

function initDB(){

 if(saved){DB.dicts=saved;}
 else{

function seedItem(k,r,i){
 const it={id:k+"_"+i,name:r[0],enabled:true,useCount:0,lastUsed:0,source:"seed"};
 if(k==="building"){it.code=r[0];it.name=r[1];it.up=r[2];it.down=r[3];}
 if(k==="floor"){it.code=r[0];it.name=r[1];}
 if(k==="proc"){it.cat=r[1];it.unit=r[2];it.template=r[3];}
 if(k==="trade"){it.cat=r[1];it.cert=r[2];}
 if(k==="machine"){it.model=r[1];it.unit=r[2];}
 if(k==="material"){it.spec=r[1];it.unit=r[2];}
 if(k==="person"){it.role=r[1];it.org=r[2];}
 if(k==="problem"){it.fix=r[1];it.cat=r[2];}
 return it;
}

function dict(k){return DB.dicts[k]||[]}
function enabled(k){return dict(k).filter(x=>x.enabled)}
function findItem(k,name){return dict(k).find(x=>x.name===name)}
function recordUse(k,name){
 if(!name)return;
 const r=DB.recent[k]||[];const i=r.indexOf(name);if(i>=0)r.splice(i,1);r.unshift(name);DB.recent[k]=r.slice(0,8);
 const it=findItem(k,name);if(it){it.useCount=(it.useCount||0)+1;it.lastUsed=Date.now();}
 LS.set("rz_recent",DB.recent);saveDicts();
}
function addToDict(k,name,extra){
 const it=Object.assign({id:k+"_u"+Date.now()+"_"+Math.floor(Math.random()*999),name,enabled:true,useCount:0,lastUsed:0,source:"user"},extra||{});
 dict(k).push(it);saveDicts();return it;
}

function makeCombo(mount,dictKey,opts){
 opts=opts||{};
 const wrap=el("div","combo");
 const inp=el("input");inp.type="text";inp.placeholder=opts.ph||"输入检索或直接打字";inp.autocomplete="off";
 if(opts.value)inp.value=opts.value;
 if(opts.field)inp.dataset.k=opts.field;
 const pop=el("div","pop");pop.hidden=true;
 wrap.append(inp,pop);mount.replaceChildren(wrap);
 let items=[];
 function renderPop(q){
  q=(q||"").trim();
  const all=enabled(dictKey).filter(opts.filterFn?opts.filterFn(inp.closest(".row")):()=>true);
  const ql=q.toLowerCase(),qi=initials(q);
  const match=it=>{
   if(!q)return true;
   const nm=it.name.toLowerCase();
   if(nm.includes(ql))return true;
   const sub=(it.model||it.spec||it.code||it.cat||it.role||"").toLowerCase();
   if(sub&&sub.includes(ql))return true;
   if(qi&&initials(it.name).includes(qi))return true;
   return false;
  };
  const recent=(DB.recent[dictKey]||[]).map(n=>all.find(x=>x.name===n)).filter(Boolean).slice(0,5);
  const rest=all.filter(match);
  pop.replaceChildren();
  if(recent.length&&(!q||recent.some(match))){
   pop.append(el("div","grp","最近使用"));
   recent.filter(match).forEach(it=>pop.append(itemEl(it,true)));
  }
  pop.append(el("div","grp",q?"匹配结果":"全部（"+rest.length+"）"));
  if(!rest.length)pop.append(el("div","empty","无匹配项"));
  rest.slice(0,200).forEach(it=>pop.append(itemEl(it,false)));
  if(q&&!all.some(x=>x.name===q)&&opts.allowAdd!==false){
   const a=el("div","it addnew","＋ 将『"+esc(q)+"』加入字典并选用");
   a.onmousedown=e=>{e.preventDefault();addToDict(dictKey,q);pick(q);toast("已加入字典："+q);};
   pop.append(a);
  }
 }
 function itemEl(it,isRecent){
  const d=el("div","it");
  d.append(el("span",null,esc(it.name)));
  if(isRecent)d.append(el("span","tag","最近"));
  const sub=it.model||it.spec||(it.cat?it.cat:"")||(it.role||"")||(it.unit?"["+it.unit+"]":"");
  if(sub)d.append(el("span","sub",esc(sub)));
  d.onmousedown=e=>{e.preventDefault();pick(it.name,it);};
  return d;
 }
 function pick(name,it){
  inp.value=name;pop.hidden=true;recordUse(dictKey,name);
  if(opts.onPick)opts.onPick(name,it||findItem(dictKey,name),inp.closest(".row"));
  inp.dispatchEvent(new Event("change",{bubbles:true}));
 }
 inp.addEventListener("focus",()=>{renderPop(inp.value);pop.hidden=false;});
 inp.addEventListener("input",()=>{renderPop(inp.value);pop.hidden=false;});
 inp.addEventListener("blur",()=>{setTimeout(()=>{pop.hidden=true;},150);if(inp.value.trim())recordUse(dictKey,inp.value.trim());});
 inp.addEventListener("keydown",e=>{if(e.key==="Escape")pop.hidden=true;});
 return {input:inp,wrap,set(v){inp.value=v||"";},get(){return inp.value.trim();}};
}

function floorFilterFn(row){
 if(!row)return ()=>true;
 const bInp=row.querySelector('[data-k="building"]');
 const b=bInp?findItem("building",bInp.value.trim()):null;
 return it=>{
  if(!b)return true;
  const c=it.code||"";
  if(/^(\d+)F$/.test(c)){const n=Number(c.match(/^(\d+)F$/)[1]);return n<=b.up;}
  if(c==="B2")return b.down>=2;
  if(c==="B1")return b.down>=1;
  if(c==="DT")return b.up>=8;
  return true;
 };
}
function hourOptions(period){return (HOURS[period]||HOURS.上午).map(h=>h+":00");}
function addRow(type,data){
 const box=$("#rows-"+type);
 const row=el("div","row");row.dataset.type=type;
 const head=el("div","rhead","<span>"+(box.children.length+1)+"</span>");
 const del=el("button","del mini","删除");del.onclick=()=>{row.remove();renum(box);draftSoon();};
 head.append(del);row.append(head);
 const grid=el("div","grid");
 SPECS[type].forEach(f=>{
  const fld=el("div","fld"+((f.t==="area"||f.k==="seg")?" full":""));
  fld.append(el("label",null,f.l));
  let ctl;
  if(f.t==="combo"){
   const mount=el("div");fld.append(mount);
   const co=makeCombo(mount,f.d,{field:f.k,ph:f.ph,value:data?data[f.k]:"",
    filterFn:f.floorFilter?floorFilterFn:null,
    onPick:f.procPick?(name,it,r)=>{
      if(it&&it.unit){const u=r.querySelector('[data-k="unit"]');if(u&&!u.value)u.value=it.unit;}
    }:f.problemPick?(name,it,r)=>{
      if(it&&it.fix){const fx=r.querySelector('[data-k="fix"]');if(fx&&!fx.value)fx.value=it.fix;}
    }:null});
   ctl=co.input;
  }else if(f.t==="select"){
   ctl=el("select");ctl.dataset.k=f.k;
   const os=f.k==="h1"||f.k==="h2"?hourOptions(data&&data.period||"上午"):f.o;
   const blank=el("option",null,"");blank.value="";ctl.append(blank);
   os.forEach(o=>{const op=el("option",null,o);op.value=o;ctl.append(op);});
   if(data&&data[f.k])ctl.value=data[f.k];
   if(f.k==="period")ctl.onchange=()=>{
    ["h1","h2"].forEach(hk=>{
     const s=row.querySelector('[data-k="'+hk+'"]');const old=s.value;
     s.replaceChildren(el("option",null,""));
     hourOptions(ctl.value).forEach(o=>{const op=el("option",null,o);op.value=o;s.append(op);});
     if([...s.options].some(o=>o.value===old))s.value=old;
    });draftSoon();
   };
   fld.append(ctl);
  }else if(f.t==="range"){
   const w=el("div","rangewrap");
   ctl=el("input");ctl.type="range";ctl.min=0;ctl.max=100;ctl.step=5;ctl.dataset.k=f.k;ctl.value=data&&data[f.k]!=null?data[f.k]:50;
   const out=el("output",null,ctl.value+"%");
   ctl.oninput=()=>{out.textContent=ctl.value+"%";};
   w.append(ctl,out);fld.append(w);
  }else if(f.t==="area"){
   ctl=el("textarea");ctl.dataset.k=f.k;ctl.placeholder=f.ph||"";ctl.value=data&&data[f.k]||"";fld.append(ctl);
  }else{
   ctl=el("input");ctl.type=f.t==="num"?"number":f.t==="time"?"time":"text";
   if(f.t==="num"){ctl.inputMode="decimal";ctl.min=0;}
   ctl.dataset.k=f.k;ctl.placeholder=f.ph||"";ctl.value=data&&data[f.k]!=null?data[f.k]:"";
   fld.append(ctl);
  }
  grid.append(fld);
 });
 row.append(grid);box.append(row);draftSoon();
 return row;
}
function renum(box){[...box.children].forEach((r,i)=>r.querySelector(".rhead span").textContent=i+1);}
function rowsData(type){
 return [...$("#rows-"+type).children].map(r=>{
  const o={};r.querySelectorAll("[data-k]").forEach(c=>{o[c.dataset.k]=c.type==="checkbox"?c.checked:c.value.trim?c.value.trim():c.value;});
  return o;
 });
}
function clearRows(type){$("#rows-"+type).replaceChildren();}
function fillRows(type,arr){clearRows(type);(arr||[]).forEach(d=>addRow(type,d));}

function updateDateHints(){
 const ds=$("#fDate").value;
 $("#fWeek").value=ds?weekCN(ds):"";
 const isToday=ds===todayStr();
 $("#backWrap").hidden=isToday;
 const hints=[];
 if(ds&&!isToday){
  const days=Math.round((new Date(todayStr())-new Date(ds))/86400000);
  hints.push("【补记】非当日日志，须填写补记原因。"+(days>7?"⚠ 已超过7天，存在合规风险，请尽快补齐签认。":""));
 }
 if(ds&&ds<"2026-09-15")hints.push("⚠ 早于开工日期2026-09-15，属开工前记录。");
 if(ds){
  const md=ds.slice(5);
  if(md>="11-15"||md<="03-15")hints.push("❄ 冬期施工时段（11-15~次年3-15）：请记录测温、保温覆盖、同条件试块留置；出罐≥15℃、入模≥10℃，≤−15℃停止浇筑。");
 }
 const w1=combos.w1?combos.w1.get():"",w2=$("#fZhuan").checked&&combos.w2?combos.w2.get():"";
 const w=w1+(w2?"转"+w2:"");
 if(/大雨|暴雨|大暴雨/.test(w))hints.push("🌧 大雨/暴雨：基坑停止开挖，排水泵全开，边坡覆盖，雨后复查支护与监测。");
 if(/雪/.test(w))hints.push("🌨 雪后：脚手板/通道除雪防滑，架体荷载复查。");
 const wind=$("#fWind").value;
 if(/6级|7级|8级/.test(wind))hints.push("💨 6级及以上风：停止吊装/架体搭拆/吊篮作业，塔吊吊钩收回、大臂顺风。");
 const tmin=parseFloat($("#fTmin").value),tmax=parseFloat($("#fTmax").value);
 if(!isNaN(tmin)&&!isNaN(tmax)&&tmax<tmin)hints.push("⚠ 最高气温低于最低气温，请核对。");
 if(!isNaN(tmin)&&tmin<=-15)hints.push("🥶 ≤−15℃：停止混凝土浇筑，已浇部位保温复查。");
 if(!isNaN(tmax)&&tmax>=35)hints.push("🥵 ≥35℃：错峰施工、防暑降温；≥40℃停止当日露天作业。");
 $("#hintBox").innerHTML=hints.map(esc).join("<br>");
 $("#headErr").textContent="";
}

/* ================= 校验与成文 ================= */
function validate(d){
 const errs=[];
 if(!d.date)errs.push("日期必填");
 if(d.date&&d.date>todayStr())errs.push("日期不能晚于今天");
 if(!d.recorder)errs.push("记录人必填");
 if(d.date&&d.date!==todayStr()&&!d.backReason)errs.push("非当日日志须填写补记原因");
 const validToday=d.today.filter(r=>r.building&&r.proc);
 if(!validToday.length)errs.push("至少填写一条今日作业内容（楼栋+工序）");
 d.today.forEach((r,i)=>{
  if((r.building||r.proc)&&(!r.building||!r.proc))errs.push("今日作业第"+(i+1)+"条：楼栋与工序须同时填写");
  if(r.qty&&!(Number(r.qty)>0))errs.push("今日作业第"+(i+1)+"条：工程量须为大于0的数值");
 });
 const tmin=parseFloat(d.tmin),tmax=parseFloat(d.tmax);
 if(!isNaN(tmin)&&!isNaN(tmax)&&tmax<tmin)errs.push("最高气温须≥最低气温");
 if((!isNaN(tmin)&&(tmin<-20||tmin>45))||(!isNaN(tmax)&&(tmax<-20||tmax>45)))errs.push("气温超出−20~45℃常规范围，请确认实测值");
 return errs;
}
function locStr(r){
 const b=findItem("building",r.building);
 let s=r.building||"";
 if(r.floor)s+=r.floor;
 if(r.seg)s+="（"+r.seg+"）";
 return s;
}
function fillTemplate(tpl,r){
 const map={"{部位":locStr(r),"{工序":r.proc||"","{数量":r.qty||"","{单位":r.unit||"","{强度等级":"","{规格":"","{班组":"","{机械":"","{时间":""};
 let s=tpl;
 for(const k in map)s=s.split(k+"}").join(map[k]);
 s=s.replace(/\{[^}]*\}/g,"").replace(/\s{2,}/g," ").trim();
 return s;
}
function todayLine(r){
 const it=findItem("proc",r.proc);
 let time="";
 if(r.period){time=r.period;if(r.h1)time+=r.h1.replace(":00","")+":00";if(r.h2)time+="–"+r.h2.replace(":00","")+":00";}
 let body;
 if(it&&it.template){body=fillTemplate(it.template,r);}
 else{body=locStr(r)+(r.proc?"进行"+r.proc:"");if(r.qty)body+="，工程量"+r.qty+(r.unit||"");}
 return body+(time?"（"+time+"）":"");
}
function generateText(d){
 const L=[];
 const back=d.date!==todayStr()?"【补记】":"";
 L.push("施 工 日 志"+back);
 L.push("编号："+(d.no||"（未保存）"));
 L.push("项目名称："+DB.settings.proj);
 L.push("日期："+fmtDateCN(d.date)+" "+d.week+(d.backReason?"　补记原因："+d.backReason:""));
 L.push("天气："+(d.weather||"无")+(tempText()?"　气温："+tempText():""));
 L.push("记录人："+d.recorder);
 L.push("");
 L.push("一、截至今日施工进度");
 const pg=d.progress.filter(r=>r.building||r.proc);
 if(pg.length)pg.forEach((r,i)=>L.push((i+1)+". "+locStr(r)+"："+(r.proc||"")+" 完成"+(r.pct||0)+"%"));
 else L.push("无");
 L.push("");
 L.push("二、今日作业内容");
 d.today.filter(r=>r.building&&r.proc).forEach((r,i)=>L.push((i+1)+". "+todayLine(r)));
 L.push("");
 L.push("三、明日计划");
 const pl=d.plan.filter(r=>r.building||r.proc);
 if(pl.length)pl.forEach((r,i)=>{
  let s=locStr(r)+(r.proc?"进行"+r.proc:"");
  if(r.qty)s+="，计划工程量"+r.qty+(r.unit||"");
  L.push((i+1)+". "+s);
 });else L.push("无");
 L.push("");
 L.push("四、未完成事项");
 if(d.undoneNone||!d.undone.filter(r=>r.item).length)L.push("无");
 else d.undone.filter(r=>r.item).forEach((r,i)=>L.push((i+1)+". "+r.item+(r.reason?"（原因："+r.reason+"）":"")));
 L.push("");
 L.push("五、资源投入");
 L.push("（一）人员");
 const lb=d.labor.filter(r=>r.trade&&Number(r.count)>0);
 if(lb.length){
  const total=lb.reduce((s,r)=>s+Number(r.count),0);
  const mg=lb.filter(r=>{const t=findItem("trade",r.trade);return t&&t.cat==="管理";}).reduce((s,r)=>s+Number(r.count),0);
  L.push(lb.map(r=>r.trade+"×"+r.count+"人").join("、")+"。");
  L.push("合计"+total+"人，其中管理人员"+mg+"人、作业人员"+(total-mg)+"人。");
 }else L.push("无");
 L.push("（二）机械");
 const mc=d.machine.filter(r=>r.name);
 if(mc.length)mc.forEach((r,i)=>L.push((i+1)+". "+r.name+"×"+(r.count||1)+(r.status?"（"+r.status+"）":"")));
 else L.push("无");
 L.push("（三）材料");
 const mt=d.material.filter(r=>r.name);
 if(mt.length)mt.forEach((r,i)=>L.push((i+1)+". "+r.name+(r.qty?" "+r.qty+(r.unit||""):"")+(r.status?"（"+r.status+"）":"")+(r.remark?"，"+r.remark:"")));
 else L.push("无");
 L.push("");
 L.push("六、质量管理");
 L.push("（一）验收记录");
 const ac=d.accept.filter(r=>r.type||r.person||r.building);
 if(ac.length)ac.forEach((r,i)=>L.push((i+1)+". "+(r.time?r.time+" ":"")+(r.person?r.person:"监理")+"对"+(locStr(r)||"相关部位")+"进行"+(r.type||"验收")+"，结论："+(r.result||"合格")+"。"));
 else L.push("无");
 L.push("（二）质量问题");
 const ql=d.quality.filter(r=>r.problem);
 if(ql.length)ql.forEach((r,i)=>L.push((i+1)+". 发现"+r.problem+"，处理："+(r.fix||"按方案处理")+"。"));
 else L.push("无");
 L.push("");
 L.push("七、特殊情况");
 const hasStop=!d.stopNone&&(d.stop.reason||d.stop.start);
 const em=d.emergency.filter(r=>r.type);
 const ot=d.other.filter(r=>r.text);
 if(!hasStop&&!em.length&&!ot.length){L.push("无停工/复工；无突发事件；无其他事项。");}
 else{
  L.push("（一）停工/复工");
  if(hasStop)L.push("原因："+d.stop.reason+"；起止："+(d.stop.start||"")+"至"+(d.stop.end||"")+"；现场保护措施："+(d.stop.protect||"无")+"。");
  else L.push("无");
  L.push("（二）突发事件");
  if(em.length)em.forEach((r,i)=>L.push((i+1)+". "+(r.time?r.time+" ":"")+"发生"+r.type+"。处置："+(r.handle||"")+"；损失："+(r.loss||"无")+"；报告对象："+(r.report||"无")+"。"));
  else L.push("无");
  L.push("（三）其他事项");
  if(ot.length)ot.forEach((r,i)=>L.push((i+1)+". "+r.text.replace(/\{[^}]*\}/g,"").trim()));
  else L.push("无");
 }
 return L.join("\n");
}

/* ================= 保存 / 编号 / 历史 ================= */
function nextNo(date){
 const key=date.replace(/-/g,"");
 const n=(DB.seq[key]||0)+1;DB.seq[key]=n;
 return DB.settings.prefix+"-"+key+"-"+String(n).padStart(2,"0");
}
function saveLog(){
 const d=collect();
 const errs=validate(d);
 if(errs.length){toast("保存失败："+errs[0],1);$("#headErr").innerHTML=errs.map(esc).join("<br>");return;}
 if(curId){
  const i=DB.logs.findIndex(x=>x.id===curId);
  if(i>=0){d.no=DB.logs[i].no;d.id=curId;DB.logs[i]={id:curId,no:d.no,date:d.date,recorder:d.recorder,updatedAt:Date.now(),data:d,text:generateText(d)};}
 }else{
  d.id="log_"+Date.now();d.no=nextNo(d.date);curId=d.id;
  DB.logs.unshift({id:d.id,no:d.no,date:d.date,recorder:d.recorder,updatedAt:Date.now(),data:d,text:generateText(d)});
 }
 $("#fNo").value=d.no;
 LS.set("rz_logs",DB.logs);LS.set("rz_seq",DB.seq);
 renderHistory();toast("已保存 "+d.no);
}
function renderHistory(){
 const box=$("#histList");box.replaceChildren();
 if(!DB.logs.length){box.append(el("div","empty","暂无历史记录"));return;}
 DB.logs.forEach(g=>{
  const it=el("div","hitem");
  it.append(el("span",null,"<b>"+esc(g.no)+"</b>　"+esc(g.date)+"　"+esc(g.recorder||"")));
  const ops=el("span","ops");
  const bLoad=el("button","mini","打开");bLoad.onclick=()=>{loadLog(g.data,true);window.scrollTo({top:0,behavior:"smooth"});toast("已载入 "+g.no);};
  const bTxt=el("button","mini","文本");bTxt.onclick=()=>{openModal(g.text,g.no);};
  const bDel=el("button","mini del","删除");bDel.onclick=()=>{
   if(!confirm("删除日志 "+g.no+"？（编号不回收）"))return;
   DB.logs=DB.logs.filter(x=>x.id!==g.id);LS.set("rz_logs",DB.logs);
   if(curId===g.id)curId=null;
   renderHistory();toast("已删除");
  };
  ops.append(bLoad,bTxt,bDel);it.append(ops);box.append(it);
 });
}
function copyYesterday(){
 const ds=$("#fDate").value||todayStr();
 const prev=DB.logs.filter(g=>g.date<ds&&g.id!==curId).sort((a,b)=>b.date.localeCompare(a.date))[0]||DB.logs.filter(g=>g.id!==curId)[0];
 if(!prev){toast("没有可复制的历史日志",1);return;}
 const d=prev.data;
 fillRows("progress",d.progress);fillRows("labor",d.labor);fillRows("machine",d.machine);
 fillRows("today",(d.plan||[]).map(p=>({building:p.building,floor:p.floor,seg:p.seg,proc:p.proc,qty:p.qty,unit:p.unit,period:"上午"})));
 updateLaborSum();draftSoon();
 toast("已复制 "+prev.date+" 日志：进度/人员/机械，明日计划→今日内容");
}

/* ================= 输出：复制 / TXT / 打印 ================= */
let lastText="",lastNo="";
function openModal(text,no){lastText=text;lastNo=no||"施工日志";$("#modalTitle").textContent="日志文本 "+(no||"");$("#modalText").value=text;$("#modal").hidden=false;}
function doCopy(text){
 const ok=()=>toast("已复制到剪贴板");
 if(navigator.clipboard&&window.isSecureContext!==false){
  navigator.clipboard.writeText(text).then(ok).catch(()=>fallbackCopy(text));
 }else fallbackCopy(text);
}
function fallbackCopy(text){
 const ta=$("#modalText");ta.value=text;$("#modal").hidden=false;ta.focus();ta.select();
 try{if(document.execCommand("copy")){toast("已复制到剪贴板");return;}}catch(e){}
 toast("自动复制失败，请在弹窗中长按全选复制",1);
}
function genAndCopy(){
 const d=collect();
 const errs=validate(d);
 if(errs.length){$("#headErr").innerHTML=errs.map(esc).join("<br>");toast("无法生成："+errs[0],1);return;}
 $("#headErr").textContent="";
 const text=generateText(d);
 openModal(text,d.no);doCopy(text);
}
function doPrint(){
 const d=collect();
 const text=lastText||generateText(d);
 $("#printArea").innerHTML="<h1>施 工 日 志</h1><pre>"+esc(text.replace(/^施 工 日 志.*\n/,""))+"</pre>"+
 "<div class='sign'><span>记录人：____________</span><span>技术负责人：____________</span><span>项目经理：____________</span></div>"+
 "<div class='sign'><span>日期：____________</span><span>监理阅签：____________</span></div>";
 window.print();
}

/* ================= 班组 / 短语 ================= */
function updateLaborSum(){
 const lb=rowsData("labor").filter(r=>r.trade&&Number(r.count)>0);
 const total=lb.reduce((s,r)=>s+Number(r.count),0);
 $("#laborSum").textContent=total?("当前合计："+total+" 人"):"";
}
function applyCrew(c){
 c.items.forEach(([trade,count])=>{if(count>0)addRow("labor",{trade,count});});
 updateLaborSum();toast("已填入班组："+c.name);
}
function renderCrews(){
 const box=$("#crewList");box.replaceChildren();
 DB.crews.forEach((c,i)=>{
  const it=el("div","hitem");
  it.append(el("span",null,"<b>"+esc(c.name)+"</b>　"+esc(c.items.map(x=>x[0]+"×"+x[1]).join("、"))));
  const ops=el("span","ops");
  const bA=el("button","mini add","填入");bA.onclick=()=>applyCrew(c);
  const bE=el("button","mini","编辑");bE.onclick=()=>{
   const s=prompt("班组配置（格式：工种:人数,工种:人数）",c.items.map(x=>x[0]+":"+x[1]).join(","));
   if(s==null)return;
   c.items=s.split(/[,，]/).map(x=>x.split(/[:：]/)).filter(p=>p[0]&&Number(p[1])>0).map(p=>[p[0].trim(),Number(p[1])]);
   LS.set("rz_crews",DB.crews);renderCrews();
  };
  const bD=el("button","mini del","删除");bD.onclick=()=>{if(confirm("删除班组「"+c.name+"」？")){DB.crews.splice(i,1);LS.set("rz_crews",DB.crews);renderCrews();}};
  ops.append(bA,bE,bD);it.append(ops);box.append(it);
 });
}
function openPhraseLib(){
 const box=el("div");
 enabled("phrase").forEach(p=>{
  const b=el("button","mini",esc(p.name));b.style.cssText="display:block;width:100%;text-align:left;margin:4px 0";
  b.onclick=()=>{addRow("other",{text:p.name});$("#modal").hidden=true;toast("已插入短语，请补全占位符");};
  box.append(b);
 });
 $("#modalTitle").textContent="常用短语库（点击插入到其他事项）";
 $("#modalText").value="";$("#modalText").hidden=true;
 const old=$("#modal .box");
 const holder=el("div");holder.id="phraseHolder";holder.style.cssText="overflow:auto;max-height:55vh";holder.append(box);
 old.insertBefore(holder,$("#modal .mops"));
 $("#modal").hidden=false;
}
function closeModal(){$("#modal").hidden=true;$("#modalText").hidden=false;const h=$("#phraseHolder");if(h)h.remove();}

/* ================= 设置 / 字典维护 ================= */
function initSettings(){
 $("#sProj").value=DB.settings.proj;$("#sPrefix").value=DB.settings.prefix;
 $("#sProj").onchange=()=>{DB.settings.proj=$("#sProj").value.trim()||DB.settings.proj;LS.set("rz_settings",DB.settings);$("#projName").textContent=DB.settings.proj;};
 $("#sPrefix").onchange=()=>{DB.settings.prefix=$("#sPrefix").value.trim()||"SZY-RZ";LS.set("rz_settings",DB.settings);};
 const sel=$("#dictSel");
 for(const k in DICT_NAMES){const o=el("option",null,DICT_NAMES[k]);o.value=k;sel.append(o);}
 sel.onchange=renderDictList;
 $("#btnDictAdd").onclick=()=>{
  const n=$("#dictNew").value.trim();if(!n)return;
  addToDict(sel.value,n);$("#dictNew").value="";renderDictList();toast("已添加");
 };
 renderDictList();renderCrews();
 $("#btnCrewAdd").onclick=()=>{
  const name=prompt("班组名称");if(!name)return;
  const s=prompt("配置（格式：工种:人数,工种:人数）","普工:10");if(s==null)return;
  const items=s.split(/[,，]/).map(x=>x.split(/[:：]/)).filter(p=>p[0]&&Number(p[1])>0).map(p=>[p[0].trim(),Number(p[1])]);
  DB.crews.push({name,items});LS.set("rz_crews",DB.crews);renderCrews();
 };
}
function renderDictList(){
 const k=$("#dictSel").value;const box=$("#dictList");box.replaceChildren();
 dict(k).forEach(it=>{
  const row=el("div","ditem"+(it.enabled?"":" off"));
  const chk=el("input");chk.type="checkbox";chk.checked=it.enabled;chk.title="启用/停用";
  chk.onchange=()=>{it.enabled=chk.checked;saveDicts();renderDictList();};
  row.append(chk);
  const sub=it.model||it.spec||it.unit||it.role||it.cat||"";
  row.append(el("span","nm",esc(it.name)+(sub?" <small style='color:var(--mut)'>"+esc(sub)+"</small>":"")));
  const bE=el("button","mini","改");bE.onclick=()=>{
   const n=prompt("修改名称",it.name);if(n==null||!n.trim())return;
   it.name=n.trim();saveDicts();renderDictList();
  };
  const bD=el("button","mini del","删");bD.onclick=()=>{
   if(!confirm("删除字典条目「"+it.name+"」？历史日志中的文字不受影响。"))return;
   DB.dicts[k]=DB.dicts[k].filter(x=>x.id!==it.id);saveDicts();renderDictList();
  };
  row.append(bE,bD);box.append(row);
 });
}

/* ================= 备份 / 草稿 ================= */
function exportBackup(){
 saveAll();
 const data={app:"construction-log",version:1,exportedAt:new Date().toISOString(),dicts:DB.dicts,recent:DB.recent,logs:DB.logs,seq:DB.seq,settings:DB.settings,crews:DB.crews};
 download("施工日志备份_"+todayStr()+".json",JSON.stringify(data,null,1),"application/json");
 toast("已导出JSON备份");
}
function importBackup(file){
 const r=new FileReader();
 r.onload=()=>{
  try{
   const d=JSON.parse(r.result);
   if(!d.dicts||!d.logs)throw new Error("文件格式不符");
   if(!confirm("导入将覆盖当前全部数据（字典/历史/设置），继续？"))return;
   DB.dicts=d.dicts;DB.recent=d.recent||{};DB.logs=d.logs;DB.seq=d.seq||{};DB.settings=d.settings||DB.settings;DB.crews=d.crews||DB.crews;
   saveAll();curId=null;
   initSettings();renderHistory();loadLog({date:todayStr(),recorder:DB.settings.defRec,stopNone:true,undoneNone:true});
   $("#projName").textContent=DB.settings.proj;
   toast("导入成功："+DB.logs.length+"条日志");
  }catch(e){toast("导入失败："+e.message,1);}
 };
 r.readAsText(file,"utf-8");
}
let draftTimer;
function draftSoon(){clearTimeout(draftTimer);draftTimer=setTimeout(()=>{LS.set("rz_draft",{id:curId,data:collect()});},800);}

/* ================= 事件绑定与启动 ================= */
function bind(){
 document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addRow(b.dataset.add));
 $("#btnGen").onclick=genAndCopy;
 $("#btnSave").onclick=saveLog;
 $("#btnMenu").onclick=e=>{e.stopPropagation();$("#menu").hidden=!$("#menu").hidden;};
 document.addEventListener("click",e=>{if(!e.target.closest("#menu")&&!e.target.closest("#btnMenu"))$("#menu").hidden=true;});
 $("#mNew").onclick=()=>{$("#menu").hidden=true;newLog();};
 $("#mYest").onclick=()=>{$("#menu").hidden=true;copyYesterday();};
 $("#mHist").onclick=()=>{$("#menu").hidden=true;$("#secHistory").open=true;$("#secHistory").scrollIntoView();};
 $("#mSet").onclick=()=>{$("#menu").hidden=true;$("#secSettings").open=true;$("#secSettings").scrollIntoView();};
 $("#mExp").onclick=()=>{$("#menu").hidden=true;exportBackup();};
 $("#mImp").onclick=()=>{$("#menu").hidden=true;$("#fileImp").click();};
 $("#fileImp").onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value="";};
 $("#mCopy").onclick=()=>doCopy($("#modalText").value);
 $("#mTxt").onclick=()=>download((lastNo||"施工日志")+".txt",$("#modalText").value);
 $("#mPrint").onclick=doPrint;
 $("#mClose").onclick=closeModal;
 $("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
 $("#btnCrew").onclick=()=>{
  const box=el("div");
  DB.crews.forEach(c=>{const b=el("button","mini",esc(c.name)+"（"+c.items.map(x=>x[0]+"×"+x[1]).join("、")+"）");b.style.cssText="display:block;width:100%;text-align:left;margin:4px 0";b.onclick=()=>{applyCrew(c);closeModal();};box.append(b);});
  $("#modalTitle").textContent="选择班组一键填入";$("#modalText").hidden=true;
  const holder=el("div");holder.id="phraseHolder";holder.style.cssText="overflow:auto;max-height:55vh";holder.append(box);
  $("#modal .box").insertBefore(holder,$("#modal .mops"));$("#modal").hidden=false;
 };
 $("#btnPhrase").onclick=openPhraseLib;
 document.addEventListener("input",e=>{if(e.target.closest("main")){draftSoon();if(e.target.closest("#rows-labor"))updateLaborSum();}});
 document.addEventListener("change",e=>{if(e.target.closest("main")){draftSoon();if(e.target.closest("#rows-labor"))updateLaborSum();}});
 if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
 }
}
function boot(){
 initDB();
 $("#projName").textContent=DB.settings.proj;
 initHeader();initSettings();bind();renderHistory();
 const draft=LS.get("rz_draft",null);
 if(draft&&draft.data){loadLog(draft.data,true);curId=draft.id||null;if(curId){const g=DB.logs.find(x=>x.id===curId);if(g)$("#fNo").value=g.no;}}
 else loadLog({date:todayStr(),recorder:DB.settings.defRec,stopNone:true,undoneNone:true});
 updateLaborSum();
}
boot();
</script>
</body>
</html>
